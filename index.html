// CSV column header → index mapping (0-based)
// Expected headers: RK, TIERS, PLAYER NAME, TEAM, POS, AGE, BEST, WORST, AVG., STD.DEV, ECR VS. ADP
// We extract: PLAYER NAME, TEAM, POS (strip trailing digit), AGE
// Positions mapped: QB→QB, RB→RB, WR→WR, TE→TE, DST/K → skipped (not fantasy-relevant here)

function parsePlayerCSV(csvText) {
  const lines = csvText.trim().split(/\r?\n/);
  if (lines.length < 2) return [];

  // Parse header row to find column indices dynamically
  const headers = parseCSVRow(lines[0]).map(h => h.trim().toUpperCase());
  const iName = headers.findIndex(h => h.includes("PLAYER") && h.includes("NAME"));
  const iTeam = headers.findIndex(h => h === "TEAM");
  const iPos  = headers.findIndex(h => h === "POS");
  const iAge  = headers.findIndex(h => h === "AGE");

  if (iName < 0 || iTeam < 0 || iPos < 0) return [];

  const players = [];
  const seen = new Set();

  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVRow(lines[i]);
    if (!cols || cols.length < Math.max(iName, iTeam, iPos) + 1) continue;

    const name = cols[iName]?.trim();
    const team = cols[iTeam]?.trim().toUpperCase();
    // Strip trailing digits from position: WR1→WR, RB2→RB, QB1→QB, TE1→TE
    const rawPos = cols[iPos]?.trim().toUpperCase().replace(/\d+$/, "");
    const age  = iAge >= 0 ? parseInt(cols[iAge]) || 0 : 0;

    if (!name || !rawPos) continue;
    // Only include positions the app tracks
    if (!["QB","RB","WR","TE"].includes(rawPos)) continue;
    // Skip duplicates by name
    if (seen.has(name)) continue;
    seen.add(name);

    players.push({ name, team: team||"", pos: rawPos, age });
  }
  return players;
}

// Handles quoted fields with commas inside them
function parseCSVRow(line) {
  const result = [];
  let cur = "";
  let inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      inQuote = !inQuote;
    } else if (ch === "," && !inQuote) {
      result.push(cur);
      cur = "";
    } else if (ch === "\t" && !inQuote) {
      // Also handle tab-separated
      result.push(cur);
      cur = "";
    } else {
      cur += ch;
    }
  }
  result.push(cur);
  return result;
}

// Simple hash — not cryptographic but good enough for fantasy football
async function hashPass(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

// Hook: fetches and parses the player pool CSV from Google Drive
function usePlayerPool() {
  const [pool, setPool]       = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState(null);

  useEffect(() => {
    // Try multiple proxies for Google Drive CSV
    const driveUrl = "https://drive.google.com/uc?export=download&id=" + PLAYER_POOL_FILE_ID;
    const urls = [
      "https://corsproxy.io/?url=" + encodeURIComponent(driveUrl),
      "https://api.allorigins.win/raw?url=" + encodeURIComponent(driveUrl),
      "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(driveUrl),
      "https://drive.usercontent.google.com/download?id=" + PLAYER_POOL_FILE_ID + "&export=download&authuser=0",
    ];

    async function fetchPool() {
      let lastErr = null;
      for (const url of urls) {
        try {
          console.log("[Pool] trying:", url.slice(0,80));
          const res = await fetch(url, { cache: "no-cache", mode: "cors" });
          if (!res.ok) { lastErr = new Error(`HTTP ${res.status} @ ${url.slice(0,60)}`); continue; }
          const text = await res.text();
          // Sanity check — should look like CSV with PLAYER NAME header
          if (!text.toUpperCase().includes("PLAYER")) {
            lastErr = new Error(`Not a CSV (got: ${text.slice(0,40)})`);
            continue;
          }
          const parsed = parsePlayerCSV(text);
          if (parsed.length > 0) {
            setPool(parsed);
            setLoading(false);
            return;
          }
        } catch (e) {
          lastErr = e;
        }
      }
      // If all URLs failed, show error but don't crash the app
      setError(lastErr?.message || "Could not load player list");
      setLoading(false);
    }

    fetchPool().catch(e => {
      console.error("[Pool] Unhandled error:", e);
      setError((e && e.message) ? e.message : String(e));
      setLoading(false);
    });
  }, []);

  return { pool, loading, error };
}

// Net Cap Hit column = (salary × years × 0.5) - salary  [can be negative]
const calcNetCapHit = p => Math.round((p.salary||0)*(p.years||0)*0.5 - (p.salary||0));

// Cut Penalty = salary × years_remaining × 0.5  [always ≥ 0, no salary offset]
const calcCutPenalty = p => Math.round((p.salary||0)*(p.years||0)*0.5);

// Format: >=1000 → $x.xK  |  <1000 → $n
const formatSal = v => {
  if (v == null || v === "" || v === 0) return "$0";
  const n = Number(v);
  if (n >= 1000) return "$" + parseFloat((n/1000).toFixed(1)) + "K";
  return "$" + n;
};

    return pool.filter(p => p.name.toLowerCase().includes(q) && !existingNames.has(p.name)).slice(0,10);
  },[value,existingNames,pool]);
  return (
    <div style={{position:"relative"}}>
      <input style={{...inputSt,borderColor:open&&results.length?"#4a8fd9":C.border}} value={value}
        onChange={e=>{ onChange(e.target.value); setOpen(true); }}
        onFocus={()=>setOpen(true)} onBlur={()=>setTimeout(()=>setOpen(false),150)}
        placeholder={poolLoading?"Loading players…":poolError?"Player list unavailable":"Search player name…"} autoComplete="off"/>
      {open && poolLoading && (
        <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:999,background:C.surface2,border:`1px solid ${C.border}`,borderTop:"none",padding:"12px",fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:C.muted}}>
          Loading player list…
        </div>
      )}
      {open && poolError && !poolLoading && (
        <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:999,background:C.surface2,border:"1px solid rgba(200,16,46,0.4)",borderTop:"none",padding:"10px 12px",fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:"#ff8888"}}>
          ⚠ Could not load player list — type name manually
        </div>
      )}
      {open && results.length>0 && (
        <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:999,background:C.surface2,border:`1px solid #4a8fd9`,borderTop:"none",maxHeight:200,overflowY:"auto"}}>
          {results.map((p,i)=>(
            <div key={i} onMouseDown={()=>{ onSelect(p); setOpen(false); }}
              style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 12px",cursor:"pointer",borderBottom:`1px solid ${C.border}`}}
              onMouseEnter={e=>e.currentTarget.style.background=C.surface}
              onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <PosChip pos={p.pos}/>
                <span style={{fontSize:13,fontWeight:600,color:C.white}}>{p.name}</span>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:C.offwhite}}>{formatSal(p.salary)}/{p.years}yr</div>
                <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:C.muted}}>{p.team}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Player Form ──────────────────────────────────────────────
function PlayerForm({ initial, existingNames, onSave, onCancel, isEdit, pool=[], poolLoading=false, poolError=null }) {
  const blank = {name:"",pos:"QB",team:"",salary:"",years:"",rookie:false,taxi:false,ir:false,starter:false,temp:false};
  const [f, setF] = useState(initial||blank);
  const [autofilled, setAutofilled] = useState(false);
  const set = (k,v) => setF(p=>({...p,[k]:v}));
  const penalty = useMemo(()=>{ const s=parseFloat(f.salary)||0,y=parseFloat(f.years)||0; return s>0&&y>0?Math.round(s*y*0.5):0; },[f.salary,f.years]);
  function handlePoolSelect(p) {
    // From the live CSV: name, team, pos, age are available.
    // salary and years must be entered manually (not in the rankings CSV).
    setF(prev=>({...prev,
      name: p.name,
      pos:  p.pos,
      team: p.team || prev.team,
      // Don't overwrite salary/years — user must enter those
    }));
    setAutofilled(true);
  }
  function handleSubmit() {
    if (!f.name.trim()) { alert("Player name is required."); return; }
    onSave({name:f.name.trim(),pos:f.pos,team:f.team,salary:parseFloat(f.salary)||0,years:parseInt(f.years)||0,rookie:!!f.rookie,taxi:!!f.taxi,ir:!!f.ir,starter:!!f.starter,temp:!!f.temp});
  }
  return (
    <div>
      {!isEdit && (
        <Field label="Search Existing Players">
          <PlayerSearchField value={f.name} onChange={v=>{ set("name",v); setAutofilled(false); }} onSelect={handlePoolSelect} existingNames={existingNames} pool={pool} poolLoading={poolLoading} poolError={poolError}/>
          {autofilled && <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:"#77dd77",marginTop:5,padding:"6px 10px",background:"rgba(119,221,119,0.08)",border:"1px solid rgba(119,221,119,0.2)"}}>✓ Player matched — enter salary &amp; contract years below</div>}
        </Field>
      )}
      {isEdit && <Field label="Player Name"><input style={inputSt} value={f.name} onChange={e=>set("name",e.target.value)} placeholder="First Last"/></Field>}
      {(!isEdit || f.temp || true) && (
        <label style={{display:"flex",alignItems:"flex-start",gap:10,padding:"11px 13px",marginBottom:14,cursor:"pointer",border:`1px solid ${f.temp?"rgba(255,183,77,0.5)":C.border}`,background:f.temp?"rgba(255,183,77,0.06)":"transparent",transition:"all 0.15s"}}>
          <input type="checkbox" checked={!!f.temp} onChange={e=>set("temp",e.target.checked)} style={{accentColor:"#ffb347",width:15,height:15,marginTop:1,flexShrink:0}}/>
          <div>
            <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:f.temp?"#ffb347":C.muted,letterSpacing:1,textTransform:"uppercase",marginBottom:3}}>Hypothetical / Temporary</div>
            <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:C.muted,lineHeight:1.5}}>{f.temp?"Uncheck to make this player part of your actual roster.":"This player won't actually be added to your roster — they're just used to preview cap impact."}</div>
          </div>
        </label>
      )}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Field label="Position">
          <select style={inputSt} value={f.pos} onChange={e=>set("pos",e.target.value)}>
            {POS_LIST.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
        </Field>
        <Field label="NFL Team">
          <select style={inputSt} value={f.team} onChange={e=>set("team",e.target.value)}>
            <option value="">— Select —</option>
            {NFL_TEAMS.map(t=><option key={t.abbr} value={t.abbr}>{t.abbr} – {t.name}</option>)}
          </select>
        </Field>
        <Field label="Salary ($)"><input style={inputSt} type="number" min="1" value={f.salary} onChange={e=>set("salary",e.target.value)} placeholder="e.g. 45"/></Field>
        <Field label="Contract Years"><input style={inputSt} type="number" min="1" max="10" value={f.years} onChange={e=>set("years",e.target.value)} placeholder="e.g. 3"/></Field>
      </div>
      {penalty>0 && <div style={{background:"rgba(200,16,46,0.08)",border:"1px solid rgba(200,16,46,0.25)",padding:"8px 12px",marginBottom:12,fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:"#ff8888"}}>{`Cut penalty if released: ${formatSal(penalty)} (${f.years} yrs × ${formatSal(parseFloat(f.salary||0))} × 0.5)`}</div>}
      <div style={{display:"flex",gap:16,marginBottom:16,flexWrap:"wrap"}}>
        {[["rookie","Rookie"],["taxi","Taxi"],["ir","IR"],["starter","Starter"]].map(([k,label])=>(
          <label key={k} style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer"}}>
            <input type="checkbox" checked={!!f[k]} onChange={e=>set(k,e.target.checked)} style={{accentColor:C.red,width:15,height:15}}/>
            <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:C.muted,letterSpacing:1,textTransform:"uppercase"}}>{label}</span>
          </label>
        ))}
      </div>
      <div style={{display:"flex",gap:10}}>
        <RedBtn onClick={handleSubmit}>{isEdit?"Update":"Add Player"}</RedBtn>
        <GhostBtn onClick={onCancel}>Cancel</GhostBtn>
      </div>
    </div>
  );
}

// ── MAIN ─────────────────────────────────────────────────────
function App() {
  const { pool: playerPool, loading: poolLoading, error: poolError } = usePlayerPool();
  const { franchises: mflFranchises, buildRoster, loading: mflLoading, error: mflError } = useMFLData();
  // Default loginUser to first franchise once MFL data loads
  const [mflInitialized, setMflInitialized] = useState(false);
  const [screen, setScreen]       = useState("login");
  const [teamName, setTeamName]   = useState("");
  const [loginUser, setLoginUser] = useState(""); // holds franchise_id
  const [loginErr, setLoginErr]     = useState("");
  const [loginScreen, setLoginScreen] = useState("main"); // main | reset | admin
  const [loginPass, setLoginPass]     = useState("");
  const [newPass1, setNewPass1]       = useState("");
  const [newPass2, setNewPass2]       = useState("");
  const [adminPass, setAdminPass]     = useState("");
  const [adminErr, setAdminErr]       = useState("");
  const [adminMsg, setAdminMsg]       = useState("");
  const [adminFranchise, setAdminFranchise] = useState("");
  const [sbLoading, setSbLoading]     = useState(false);
  const [isAdmin, setIsAdmin]         = useState(false);
  const [currentFranchiseId, setCurrentFranchiseId] = useState("");

  // Once MFL franchises load, default to first franchise
  useEffect(()=>{
    if (!mflInitialized && mflFranchises.length > 0) {
      setLoginUser(mflFranchises[0].name);
      setMflInitialized(true);
    }
  },[mflFranchises, mflInitialized]);

  const [viewFranchise, setViewFranchise] = useState(null); // {id, name} or null = own team
  const [viewPlayers, setViewPlayers]     = useState([]); // read-only view roster
  const [viewCutPlayers, setViewCutPlayers] = useState([]);
  const [viewWatchList, setViewWatchList]     = useState([]);

  // Load viewed franchise roster when viewFranchise changes
  useEffect(()=>{
    if (!viewFranchise) { setViewPlayers([]); setViewCutPlayers([]); return; }
    const vName = viewFranchise.name;
    // Try localStorage first (they may have saved cap room work)
    const rawS = localStorage.getItem(savedKey(vName));
    const rawC = localStorage.getItem(cutKey(vName));
    if (rawS) {
      setViewPlayers(JSON.parse(rawS));
      setViewCutPlayers(rawC ? JSON.parse(rawC) : []);
      const rawVW = localStorage.getItem(watchKey(vName));
      setViewWatchList(rawVW ? JSON.parse(rawVW) : []);
    } else {
      const mflRoster = buildRoster(viewFranchise.id);
      setViewPlayers(mflRoster);
      setViewCutPlayers([]);
      setViewWatchList([]);
    }
  },[viewFranchise, mflFranchises]);

  const [players, setPlayers]     = useState([]);
  const [cutPlayers, setCutPlayers] = useState([]); // cut roster, tracks cap penalty
  const [watchList, setWatchList]   = useState([]); // watch list — no contracts, no cap impact
  const [saved, setSaved]         = useState([]);
  const [isDirty, setIsDirty]     = useState(false);

  const [sortCol, setSortCol]     = useState("pos");
  const [sortDir, setSortDir]     = useState(1);
  const [showRemoved, setShowRemoved] = useState(false);
  const [filterPos, setFilterPos] = useState("ALL");
  const [startersOnly, setStartersOnly] = useState(false);
  const [screen2, setScreen2]         = useState(false); // future seasons page

  const [addOpen, setAddOpen]     = useState(false);
  const [editPlayer, setEditPlayer] = useState(null);
  const [editWatchId, setEditWatchId] = useState(null);
  const [cutPlayer, setCutPlayer] = useState(null);
  const [saveOpen, setSaveOpen]   = useState(false);
  const [resetOpen, setResetOpen] = useState(false);
  const [toast, setToast]         = useState(null);
  const toastTimer = useRef(null);

  function showToast(msg, color="#4caf50") {
    setToast({msg,color});
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(()=>setToast(null),3000);
  }

  const cutKey = t => `rw_cut_${t.toLowerCase().replace(/\s+/g,'_')}`;
  function persist(p, cp=cutPlayers, wl=watchList) {
    localStorage.setItem(workingKey(teamName), JSON.stringify(p));
    localStorage.setItem(cutKey(teamName), JSON.stringify(cp));
    localStorage.setItem(watchKey(teamName), JSON.stringify(wl));
  }

  function updatePlayers(np, ncp=cutPlayers, nwl=watchList) {
    setPlayers(np);
    setCutPlayers(ncp);
    setWatchList(nwl);
    persist(np, ncp, nwl);
    setIsDirty(JSON.stringify(np)!==JSON.stringify(saved));
  }


  // ── SUPABASE AUTH ────────────────────────────────────────────
  async function doLogin() {
    setLoginErr("");
    if (!loginUser) { setLoginErr("Select a franchise."); return; }
    if (!loginPass.trim()) { setLoginErr("Enter your password."); return; }
    setSbLoading(true);
    try {
      const row = await sbGet(loginUser);
      if (!row) {
        const hash = await hashPass(loginPass);
        const defaultHash = await hashPass(DEFAULT_PASS);
        if (hash !== defaultHash) {
          setLoginErr("Franchise not found. Check Supabase setup, or use default password.");
          setSbLoading(false); return;
        }
        const franchise = MFL_FALLBACK_FRANCHISES.find(f => f.id === loginUser);
        const team = franchise ? franchise.name : loginUser;
        setTeamName(team); setIsAdmin(false);
        const rawS = localStorage.getItem(savedKey(team));
        const rawC = localStorage.getItem("rw_cut_" + team.toLowerCase().replace(/\s+/g,"_"));
        const rawW = localStorage.getItem("rw_watch_" + team.toLowerCase().replace(/\s+/g,"_"));
        const localPlayers = rawS ? JSON.parse(rawS) : (team === "Puka Nacua Apology Tour" ? SEED.map(p=>({...p})) : []);
        setSaved(localPlayers); setPlayers(localPlayers);
        setCutPlayers(rawC ? JSON.parse(rawC) : []);
        setWatchList(rawW ? JSON.parse(rawW) : []);
        setIsDirty(false); setCurrentFranchiseId(loginUser); setScreen("app");
        setSbLoading(false); return;
      }
      const hash = await hashPass(loginPass);
      const defaultHash = await hashPass(DEFAULT_PASS);
      const storedHash = row.password_hash || defaultHash;
      if (hash !== storedHash) { setLoginErr("Incorrect password."); setSbLoading(false); return; }
      if (!row.password_set) { setLoginScreen("reset"); setSbLoading(false); return; }
      const team = row.franchise_name;
      setTeamName(team); setIsAdmin(false);
      const sbPlayers    = Array.isArray(row.players)     ? row.players     : [];
      const sbCutPlayers = Array.isArray(row.cut_players) ? row.cut_players : [];
      const sbWatchList  = Array.isArray(row.watch_list)  ? row.watch_list  : [];
      const initPlayers  = sbPlayers.length > 0 ? sbPlayers : (team === "Puka Nacua Apology Tour" ? SEED.map(p=>({...p})) : []);
      setSaved(initPlayers); setPlayers(initPlayers);
      setCutPlayers(sbCutPlayers); setWatchList(sbWatchList);
      setIsDirty(false); setCurrentFranchiseId(loginUser); setScreen("app");
    } catch(e) {
      console.error("Login error:", e);
      setLoginErr("Connection error — try again.");
    }
    setSbLoading(false);
  }

  async function doResetPassword() {
    setLoginErr("");
    if (!newPass1.trim()) { setLoginErr("Enter a new password."); return; }
    if (newPass1 !== newPass2) { setLoginErr("Passwords don't match."); return; }
    if (newPass1.length < 6) { setLoginErr("Password must be at least 6 characters."); return; }
    setSbLoading(true);
    try {
      const hash = await hashPass(newPass1);
      await sbUpdate(loginUser, { password_hash: hash, password_set: true });
      const row = await sbGet(loginUser);
      const team = row.franchise_name;
      setTeamName(team); setIsAdmin(false);
      const sbPlayers    = Array.isArray(row.players)     ? row.players     : [];
      const sbCutPlayers = Array.isArray(row.cut_players) ? row.cut_players : [];
      const sbWatchList  = Array.isArray(row.watch_list)  ? row.watch_list  : [];
      const initPlayers  = sbPlayers.length > 0 ? sbPlayers : (team === "Puka Nacua Apology Tour" ? SEED.map(p=>({...p})) : []);
      setSaved(initPlayers); setPlayers(initPlayers);
      setCutPlayers(sbCutPlayers); setWatchList(sbWatchList);
      setIsDirty(false); setCurrentFranchiseId(loginUser);
      setLoginScreen("main"); setNewPass1(""); setNewPass2(""); setScreen("app");
    } catch(e) { setLoginErr("Error saving password — try again."); }
    setSbLoading(false);
  }

  async function doAdminLogin() {
    setAdminErr("");
    const hash = await hashPass(adminPass);
    const adminHash = await hashPass(ADMIN_PASS);
    if (hash !== adminHash) { setAdminErr("Incorrect admin password."); return; }
    setIsAdmin(true); setLoginScreen("admin"); setAdminPass("");
  }

  async function doAdminResetPass() {
    if (!adminFranchise) { setAdminErr("Select a franchise."); return; }
    setSbLoading(true);
    await sbUpdate(adminFranchise, { password_hash: null, password_set: false });
    setAdminMsg("Password reset. They will be prompted to set a new one on next login.");
    setSbLoading(false);
  }

  function doLogout() { setScreen("login"); setLoginErr(""); setLoginPass(""); setPlayers([]); setSaved([]); setCutPlayers([]); setWatchList([]); setTeamName(""); setIsDirty(false); setViewFranchise(null); setIsAdmin(false); setLoginScreen("main"); setCurrentFranchiseId(""); }

  // CRUD
  function handleAdd(data) { const np=[...players,{id:"p"+Date.now(),removed:false,...data,watch:false}]; updatePlayers(np); setAddOpen(false); showToast(data.temp?`👁 ${data.name} added as hypothetical`:`✓ ${data.name} added`); }
  function handleEdit(data) { const np=players.map(p=>p.id===editPlayer.id?{...p,...data}:p); updatePlayers(np); setEditPlayer(null); showToast(`✓ ${data.name} updated`); }
  function removeHypo(id) {
    const p = players.find(x=>x.id===id);
    const np = players.filter(x=>x.id!==id);
    // If promoted from watch list, put them back there
    if (p && p.fromWatchId) {
      const watchEntry = { id: p.fromWatchId, name: p.name, pos: p.pos, team: p.team, age: p.age||0, salary: p.salary||0, years: p.years||0, watch: true };
      const nwl = [...watchList.filter(w=>w.id!==p.fromWatchId), watchEntry];
      updatePlayers(np, cutPlayers, nwl);
      showToast(`${p.name} returned to watch list`);
    } else {
      updatePlayers(np);
      showToast("Hypothetical player removed");
    }
  }
  function toggleStarter(id) {
    const p = players.find(x=>x.id===id);
    if (!p) return;
    if (!p.starter && !canToggleStarter(p)) {
      if (starterCount >= 14) {
        showToast("Maximum of 14 starters already selected", "#ffb347");
      } else {
        const pos = (p.pos==="TmQB") ? "QB" : p.pos;
        showToast(`Max ${STARTER_LIMITS[pos]} ${pos}${p.pos==="TmQB"?" (QB+TmQB combined)":""} starters reached`, "#ffb347");
      }
      return;
    }
    updatePlayers(players.map(x=>x.id===id?{...x,starter:!x.starter}:x));
  }
  function doCut() {
    // Move player to cutPlayers (dead cap tracking), remove from active roster
    const np = players.filter(p=>p.id!==cutPlayer.id);
    const ncp = [...cutPlayers, {...cutPlayer, cutAt: Date.now()}];
    updatePlayers(np, ncp);
    showToast(`${cutPlayer.name} released`, C.red);
    setCutPlayer(null);
  }
  function reinstatePlayer(id) {
    // Move player back to active roster from cut list
    const p = cutPlayers.find(x=>x.id===id);
    if (!p) return;
    const {cutAt, ...player} = p;
    const np = [...players, player];
    const ncp = cutPlayers.filter(x=>x.id!==id);
    updatePlayers(np, ncp);
    showToast(`${player.name} reinstated`, "#4caf50");
  }
  function addToWatch(player) {
    // Add a player to watch list — keep salary as reference but don't count toward cap
    const wp = { id: "w"+Date.now(), name: player.name, pos: player.pos, team: player.team, age: player.age||0, salary: player.salary||0, years: player.years||0, watch: true };
    const nwl = [...watchList, wp];
    setWatchList(nwl);
    persist(players, cutPlayers, nwl);
    showToast(`${player.name} added to watch list`);
  }
  function removeFromWatch(id) {
    const p = watchList.find(x=>x.id===id);
    const nwl = watchList.filter(x=>x.id!==id);
    setWatchList(nwl);
    persist(players, cutPlayers, nwl);
    showToast(`${p?.name||"Player"} removed from watch list`);
  }
  function editWatchPlayer(updated) {
    const nwl = watchList.map(p=>p.id===updated.id ? {...p,...updated} : p);
    setWatchList(nwl);
    persist(players, cutPlayers, nwl);
    setEditPlayer(null);
  }
  function promoteFromWatch(id) {
    // Move from watch list to hypothetical roster — carry salary, store origin ID
    const p = watchList.find(x=>x.id===id);
    if (!p) return;
    const {watch, ...base} = p;
    const newPlayer = {...base, id:"p"+Date.now(), salary:p.salary||0, years:p.years||0, rookie:false, taxi:false, ir:false, starter:false, removed:false, temp:true, fromWatchId:p.id};
    const np = [...players, newPlayer];
    const nwl = watchList.filter(x=>x.id!==id);
    updatePlayers(np, cutPlayers, nwl);
    showToast(`${p.name} added as hypothetical`);
  }
  function removeFromCut(id) {
    // Permanently remove from cut list (no reinstate) — clears penalty with no trace
    const p = cutPlayers.find(x=>x.id===id);
    const ncp = cutPlayers.filter(x=>x.id!==id);
    setCutPlayers(ncp);
    persist(players, ncp);
    showToast(`${p?.name||"Player"} removed`);
  }
  async function doSave() {
    const cleaned = players.map(p=>{const c={...p};delete c.removed;return {...c,removed:false};});
    // Save to Supabase
    if (currentFranchiseId) {
      await sbUpdate(currentFranchiseId, {
        players: cleaned,
        cut_players: cutPlayers,
        watch_list: watchList,
      });
    }
    // Also persist locally as cache
    persist(cleaned, cutPlayers, watchList);
    setSaved(cleaned); setPlayers(cleaned); setIsDirty(false); setSaveOpen(false); setShowRemoved(false);
    showToast("✓ Roster saved");
  }
  function doReset() {
    const r = saved.map(p=>({...p,removed:false}));
    const rawSW = localStorage.getItem(savedWatchKey(teamName));
    const savedWatch = rawSW ? JSON.parse(rawSW) : [];
    persist(r, [], savedWatch);
    setPlayers(r); setCutPlayers([]); setWatchList(savedWatch); setIsDirty(false); setResetOpen(false); setShowRemoved(false); setStartersOnly(false);
    showToast("↩ Reset to saved","#ffb347");
  }

  function doSort(col) { if(sortCol===col) setSortDir(d=>d*-1); else{setSortCol(col);setSortDir(1);} }

  // ── APP SCREEN ────────────────────────────────────────────
  // When viewing another franchise: use their data, everything is read-only
  const isReadOnly    = false; // franchise owners only see their own team
  const displayPlayers    = players;
  const displayCutPlayers = cutPlayers;
  const displayWatchList   = watchList;
  const displayTeamName   = teamName;

  // Computed
  const existingNames = useMemo(()=>new Set(displayPlayers.map(p=>p.name)),[displayPlayers]);
  const activePlayers = useMemo(()=>displayPlayers.filter(p=>!p.taxi&&!p.ir&&!p.watch),[displayPlayers]);
  const taxiPlayers   = useMemo(()=>displayPlayers.filter(p=>p.taxi&&!p.watch),[displayPlayers]);
  const capUsed       = useMemo(()=>displayPlayers.filter(p=>!p.watch).reduce((s,p)=>s+(p.ir?(p.salary||0)*0.5:(p.salary||0)),0),[displayPlayers]);
  // Cap penalty: sum of cut penalties from cut players list
  const capPenalty    = useMemo(()=>displayCutPlayers.reduce((s,p)=>s+calcCutPenalty(p),0),[displayCutPlayers]);
  // Cap Space = Salary Cap − salaries − cut penalties
  const capSpace      = TOTAL_CAP - capUsed - capPenalty;
  const capPct        = Math.min(100,Math.round(((capUsed+capPenalty)/TOTAL_CAP)*100));
  const starterCount  = useMemo(()=>displayPlayers.filter(p=>p.starter&&!p.watch).length,[displayPlayers]);
  const startersByPos = useMemo(()=>{

  const removedCount  = 0;

  const sorted = useMemo(()=>{

    if (startersOnly) list=list.filter(p=>p.starter);
    return list.sort((a,b)=>{
      // primary sort
      let diff = 0;
      if (sortCol==="pos")    diff=(POS_ORDER[a.pos]||0)-(POS_ORDER[b.pos]||0);
      else if(sortCol==="name")   diff=a.name.localeCompare(b.name);
      else if(sortCol==="salary") diff=(b.salary||0)-(a.salary||0);
      else if(sortCol==="penalty")diff=calcCutPenalty(b)-calcCutPenalty(a);
      diff *= sortDir;
      if(diff!==0) return diff;
      // secondary: starters first
      return (b.starter?1:0)-(a.starter?1:0);
    });
  },[players,showRemoved,filterPos,startersOnly,sortCol,sortDir]);
  const spaceAccent   = capSpace<0?"danger":capSpace<30000?"warn":"good";  // threshold 30K
  const rosterAccent  = activePlayers.length>ACTIVE_MAX?"danger":activePlayers.length===ACTIVE_MAX?"warn":"blue";
  const taxiAccent    = taxiPlayers.length>TAXI_MAX?"danger":taxiPlayers.length===TAXI_MAX?"warn":"blue";
  const starterAccent = startersOnly?"red":"neutral";

  // ── RENDER ─────────────────────────────────────────────────
  const loginJSX = (
    <>
      <style>{globalCss}</style>
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden",background:C.bg,padding:16}}>

        <div style={{position:"relative",width:"100%",maxWidth:420,background:C.surface,border:`1px solid ${C.border}`,borderTop:`4px solid ${loginScreen==="admin"?"#ffb347":C.red}`,padding:"38px 28px 32px",minHeight:320,boxShadow:"0 40px 80px rgba(0,0,0,0.7)",animation:"fadeUp 0.45s ease both"}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:11,fontWeight:700,letterSpacing:5,textTransform:"uppercase",color:loginScreen==="admin"?"#ffb347":C.red,marginBottom:6}}>League Reenwood</div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:52,fontWeight:900,lineHeight:0.95,color:C.white,textTransform:"uppercase",marginBottom:4,letterSpacing:1,textShadow:"0 2px 12px rgba(0,0,0,0.8)"}}>CAP<br/><span style={{color:loginScreen==="admin"?"#ffb347":C.red}}>{loginScreen==="admin"?"ADMIN":"ROOM"}</span></div>

{isDirty&&<div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:8,letterSpacing:1,color:"#ffb347",background:"rgba(255,179,71,0.12)",border:"1px solid rgba(255,179,71,0.35)",padding:"2px 6px",animation:"pulse 2s infinite",flexShrink:0}}>UNSAVED</div>}

              </>

      <div style={{maxWidth:640,margin:"0 auto",padding:"12px 10px 80px"}}>

                  {/* Salary */}
                  <td style={{padding:"7px 6px",textAlign:"right",verticalAlign:"middle",whiteSpace:"nowrap"}}>
                    <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:12,color:C.offwhite,fontWeight:500}}>{formatSal(p.salary||0)}</div>
                    <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:p.ir?"#ff8888":C.muted}}>{p.ir?`${p.years?p.years+"yr ":""}½ cap`:(p.years?`${p.years}yr`:"—")}</div>
                  </td>

                  {/* Penalty */}
                  <td style={{padding:"7px 6px",textAlign:"right",verticalAlign:"middle",whiteSpace:"nowrap"}}>
                    <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:calcNetCapHit(p)<0?"#ffb347":calcNetCapHit(p)===0?C.muted:"#ff8888"}}>{calcNetCapHit(p)<0?"-":""}{formatSal(Math.abs(calcNetCapHit(p)))}</span>
                  </td>


                  {/* Actions */}
                  <td style={{padding:"7px 8px 7px 4px",textAlign:"right",verticalAlign:"middle",whiteSpace:"nowrap"}}>
                    <div style={{display:"flex",gap:3,justifyContent:"flex-end"}}>
                      {!isReadOnly&&<button onClick={()=>setEditPlayer(p)} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"3px 7px",fontFamily:"'Share Tech Mono',monospace",fontSize:9,cursor:"pointer",textTransform:"uppercase"}}>Edit</button>}
                      {!isReadOnly&&p.temp&&<button onClick={()=>removeHypo(p.id)} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"3px 7px",fontFamily:"'Share Tech Mono',monospace",fontSize:9,cursor:"pointer",textTransform:"uppercase"}}>Rmv</button>}
                      {!isReadOnly&&!p.temp&&<button onClick={()=>setCutPlayer(p)} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"3px 7px",fontFamily:"'Share Tech Mono',monospace",fontSize:9,cursor:"pointer",textTransform:"uppercase"}}
                        onMouseEnter={e=>{e.currentTarget.style.borderColor=C.red;e.currentTarget.style.color=C.red;}}
                        onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.muted;}}>Cut</button>}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {/* Below-table row count */}
        <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",marginTop:8,marginBottom:16}}>
          <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:C.muted}}>
            {sorted.length} player{sorted.length!==1?"s":""} shown{startersOnly?" · ★ starters only":""}
          </div>
        </div>

        {/* PROMINENT CAP FOOTER */}
        <div style={{background:"#080d1e",border:`1px solid ${C.border}`,borderTop:`2px solid ${C.border}`,padding:"14px 16px",marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:3}}>Total Cap</div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:800,lineHeight:1,color:C.white}}>{formatSal(TOTAL_CAP)}</div>
            </div>
            <div style={{textAlign:"center"}}>
              <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:3}}>Cap Used</div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:800,lineHeight:1,color:C.offwhite}}>{formatSal(capUsed)}</div>
              {capPenalty>0&&<div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:"#ff8888",marginTop:2}}>+pen {formatSal(capPenalty)}</div>}
            </div>
            <div style={{textAlign:"center"}}>
              <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:3}}>Cap Penalty</div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:800,lineHeight:1,color:capPenalty>0?"#ff8888":C.muted}}>
                {formatSal(capPenalty)}
              </div>
              <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:C.muted,marginTop:2}}>{capPenalty>0?"dead cap":"no cuts"}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:3}}>{capSpace<0?"Over Cap":"Cap Space"}</div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:800,lineHeight:1,color:capSpace<0?C.red:"#77dd77"}}>{formatSal(Math.abs(capSpace))}</div>
              <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:C.muted,marginTop:2}}>{capPct}% used</div>
            </div>
          </div>
        </div>

        {/* STARTER BREAKDOWN */}
        {starterCount > 0 && (
          <div style={{background:"#080d1e",border:`1px solid ${C.border}`,padding:"10px 16px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
            <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.muted}}>Starters</div>
            <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
              {[["QB","QB+TmQB",2],["RB","RB",6],["WR","WR",6],["TE","TE",4]].map(([pos,label,max])=>(
                <div key={pos} style={{textAlign:"center"}}>
                  <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:C.muted,marginBottom:2}}>{label}</div>
                  <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:800,color:startersByPos[pos]===max?"#77dd77":startersByPos[pos]>max?"#ff8888":C.offwhite}}>
                    {startersByPos[pos]}/{max}
                  </div>
                </div>
              ))}
              <div style={{textAlign:"center"}}>
                <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:C.muted,marginBottom:2}}>TOTAL</div>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:800,color:starterCount===14?"#77dd77":C.offwhite}}>
                  {starterCount}/14
                </div>
              </div>
            </div>
          </div>
        )}

        {/* CUT PLAYERS TABLE */}
        {displayCutPlayers.length>0&&(
          <div style={{marginBottom:12}}>
            <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:8}}>Dead Cap — Cut Players</div>
            <div style={{background:C.surface,border:`1px solid ${C.border}`}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead>
                  <tr style={{background:C.surface2,borderBottom:`1px solid ${C.border}`}}>
                    <th style={{padding:"6px 10px",textAlign:"left",fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:1.5,textTransform:"uppercase",color:C.muted}}>Player</th>
                    <th style={{padding:"6px 8px",textAlign:"right",fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:1.5,textTransform:"uppercase",color:C.muted}}>Salary</th>
                    <th style={{padding:"6px 8px",textAlign:"right",fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:1.5,textTransform:"uppercase",color:C.muted}}>Penalty</th>
                    <th style={{padding:"6px 10px",textAlign:"right",fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:C.muted}}></th>
                  </tr>
                </thead>
                <tbody>
                  {displayCutPlayers.map((p,i)=>{
                    const pen=calcCutPenalty(p);
                    return(
                      <tr key={p.id} style={{borderBottom:`1px solid ${i===cutPlayers.length-1?"transparent":C.border}`,borderLeft:`3px solid ${POS_COLOR[p.pos]||C.muted}`}}>
                        <td style={{padding:"8px 10px",verticalAlign:"middle"}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <span style={{display:"inline-block",padding:"1px 5px",borderRadius:2,fontFamily:"'Barlow Condensed',sans-serif",fontSize:11,fontWeight:700,background:"rgba(255,255,255,0.06)",border:`1px solid ${POS_COLOR[p.pos]||C.muted}`,color:POS_COLOR[p.pos]||C.muted}}>{p.pos}</span>
                            <div>
                              <div style={{fontFamily:"'Barlow',sans-serif",fontWeight:600,fontSize:13,color:C.offwhite}}>{p.name}</div>
                              <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:C.muted}}>{p.team||"—"} · {p.years}yr contract</div>
                            </div>
                          </div>
                        </td>
                        <td style={{padding:"8px 8px",textAlign:"right",verticalAlign:"middle",fontFamily:"'Share Tech Mono',monospace",fontSize:12,color:C.muted}}>{formatSal(p.salary||0)}</td>
                        <td style={{padding:"8px 8px",textAlign:"right",verticalAlign:"middle",fontFamily:"'Share Tech Mono',monospace",fontSize:12,color:"#ff8888",fontWeight:600}}>{formatSal(pen)}</td>
                        <td style={{padding:"8px 10px",textAlign:"right",verticalAlign:"middle",whiteSpace:"nowrap"}}>
                          {!isReadOnly&&<button onClick={()=>reinstatePlayer(p.id)} style={{background:"rgba(76,175,80,0.1)",border:"1px solid rgba(76,175,80,0.4)",color:"#77dd77",padding:"4px 9px",fontFamily:"'Share Tech Mono',monospace",fontSize:9,cursor:"pointer",textTransform:"uppercase",marginRight:5}}
                            onMouseEnter={e=>{e.currentTarget.style.background="rgba(76,175,80,0.2)";}}
                            onMouseLeave={e=>{e.currentTarget.style.background="rgba(76,175,80,0.1)";}}>Reinstate</button>}
                          {!isReadOnly&&<button onClick={()=>removeFromCut(p.id)} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"4px 9px",fontFamily:"'Share Tech Mono',monospace",fontSize:9,cursor:"pointer",textTransform:"uppercase"}}
                            onMouseEnter={e=>{e.currentTarget.style.borderColor=C.red;e.currentTarget.style.color=C.red;}}
                            onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.muted;}}>Remove</button>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* WATCH LIST */}
        {displayWatchList.length>0&&(
          <div style={{marginBottom:12}}>
            <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.muted,marginBottom:8}}>Watch List</div>
            <div style={{background:C.surface,border:`1px solid ${C.border}`}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead>
                  <tr style={{background:C.surface2,borderBottom:`1px solid ${C.border}`}}>
                    <th style={{padding:"6px 10px",textAlign:"left",fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:1.5,textTransform:"uppercase",color:C.muted}}>Player</th>
                    <th style={{padding:"6px 10px",textAlign:"right",fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:C.muted}}></th>
                  </tr>
                </thead>
                <tbody>
                  {displayWatchList.map((p,i)=>(
                    <tr key={p.id} style={{borderBottom:`1px solid ${i===displayWatchList.length-1?"transparent":C.border}`,borderLeft:`3px solid ${POS_COLOR[p.pos]||C.muted}`}}>
                      <td style={{padding:"8px 10px",verticalAlign:"middle"}}>
                        <div style={{display:"flex",alignItems:"center",gap:6}}>
                          <span style={{display:"inline-block",padding:"1px 5px",borderRadius:2,fontFamily:"'Barlow Condensed',sans-serif",fontSize:11,fontWeight:700,background:"rgba(255,255,255,0.06)",border:`1px solid ${POS_COLOR[p.pos]||C.muted}`,color:POS_COLOR[p.pos]||C.muted}}>{p.pos}</span>
                          <div>
                            <div style={{fontFamily:"'Barlow',sans-serif",fontWeight:600,fontSize:13,color:C.offwhite}}>{p.name}</div>
                            <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:C.muted}}>{p.team||"—"}{p.age?" · Age "+p.age:""}{p.salary?" · "+formatSal(p.salary):""}{p.years?" · "+p.years+"yr":""}</div>
                          </div>
                        </div>
                      </td>
                      <td style={{padding:"8px 10px",textAlign:"right",verticalAlign:"middle",whiteSpace:"nowrap"}}>
                        {!isReadOnly&&<>
                          <button onClick={()=>promoteFromWatch(p.id)} style={{background:"rgba(167,139,250,0.1)",border:"1px solid rgba(167,139,250,0.4)",color:"#a78bfa",padding:"4px 9px",fontFamily:"'Share Tech Mono',monospace",fontSize:9,cursor:"pointer",textTransform:"uppercase",marginRight:5}}
                            title="Add to roster as hypothetical"
                            onMouseEnter={e=>{e.currentTarget.style.background="rgba(167,139,250,0.2)";}}
                            onMouseLeave={e=>{e.currentTarget.style.background="rgba(167,139,250,0.1)";}}>+ Hyp</button>
                          <button onClick={()=>setEditWatchId(p.id)} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"4px 9px",fontFamily:"'Share Tech Mono',monospace",fontSize:9,cursor:"pointer",textTransform:"uppercase",marginRight:5}}
                            onMouseEnter={e=>{e.currentTarget.style.borderColor=C.offwhite;e.currentTarget.style.color=C.offwhite;}}
                            onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.muted;}}>Edit</button>
                          <button onClick={()=>removeFromWatch(p.id)} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:"4px 9px",fontFamily:"'Share Tech Mono',monospace",fontSize:9,cursor:"pointer",textTransform:"uppercase"}}
                            onMouseEnter={e=>{e.currentTarget.style.borderColor=C.red;e.currentTarget.style.color=C.red;}}
                            onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.muted;}}>Remove</button>
                        </>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* Future Seasons Button */}
        <button onClick={()=>setScreen2(true)} style={{
          width:"100%", padding:"13px 0",
          background:"transparent",
          border:`1px solid ${C.border}`,
          color:C.muted,
          fontFamily:"'Barlow Condensed',sans-serif",
          fontSize:15, fontWeight:700, letterSpacing:3, textTransform:"uppercase",
          cursor:"pointer", transition:"all 0.2s",
          display:"flex", alignItems:"center", justifyContent:"center", gap:8,
        }}
          onMouseEnter={e=>{e.currentTarget.style.borderColor="#4a8fd9";e.currentTarget.style.color="#4a8fd9";}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.muted;}}
        >
          <span style={{fontSize:14}}>📅</span> Show Future Seasons
        </button>
      </div>

      {/* ADD MODAL */}
      <Modal open={!!addOpen} onClose={()=>setAddOpen(false)} topColor={addOpen==="watch"?"#a78bfa":C.red}>
        <CloseBtn onClose={()=>setAddOpen(false)}/>
        <ModalTitle>{addOpen==="watch"?<>Add to <span style={{color:"#a78bfa"}}>Watch List</span></>:<>Add <span style={{color:C.red}}>Player</span></>}</ModalTitle>
        {addOpen==="watch"
          ? <WatchForm existingNames={new Set(watchList.map(p=>p.name))} onSave={p=>{addToWatch(p);setAddOpen(false);}} onCancel={()=>setAddOpen(false)} pool={playerPool} poolLoading={poolLoading} poolError={poolError}/>
          : <PlayerForm existingNames={existingNames} onSave={handleAdd} onCancel={()=>setAddOpen(false)} isEdit={false} pool={playerPool} poolLoading={poolLoading} poolError={poolError}/>
        }
      </Modal>

      {/* EDIT MODAL */}
      {editWatchId&&(()=>{
        const wp=watchList.find(p=>p.id===editWatchId);
        if(!wp) return null;
        return <Modal open={true} onClose={()=>setEditWatchId(null)}>
          <ModalTitle>Edit <span style={{color:"#a78bfa"}}>Watch Player</span></ModalTitle>
          <WatchForm initial={wp} pool={playerPool} poolLoading={poolLoading} poolError={poolError}
            existingNames={new Set(watchList.filter(p=>p.id!==editWatchId).map(p=>p.name))}
            onSave={u=>{editWatchPlayer({...wp,...u});setEditWatchId(null);}}
            onCancel={()=>setEditWatchId(null)}/>
        </Modal>;
      })()}
      <Modal open={!!editPlayer} onClose={()=>setEditPlayer(null)} topColor="#4a8fd9">
        <CloseBtn onClose={()=>setEditPlayer(null)}/>
        <ModalTitle>Edit <span style={{color:"#4a8fd9"}}>Player</span></ModalTitle>
        {editPlayer&&<PlayerForm initial={{...editPlayer,salary:editPlayer.salary||"",years:editPlayer.years||""}} existingNames={new Set()} onSave={handleEdit} onCancel={()=>setEditPlayer(null)} isEdit={true}/>}
      </Modal>

      {/* CUT CONFIRM */}
      <Modal open={!!cutPlayer} onClose={()=>setCutPlayer(null)} topColor={C.red}>
        <CloseBtn onClose={()=>setCutPlayer(null)}/>
        <div style={{textAlign:"center",padding:"6px 0"}}>
          <div style={{fontSize:28,marginBottom:10}}>✂️</div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:900,letterSpacing:2,textTransform:"uppercase",color:C.red,marginBottom:8}}>Cut Player?</div>
          <p style={{color:C.muted,fontSize:13,lineHeight:1.7,marginBottom:10}}>Release <strong style={{color:C.white}}>{cutPlayer?.name}</strong> from your roster?<br/>You can undo with Reset before saving.</p>
          {cutPlayer&&calcCutPenalty(cutPlayer)>0&&<div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:"#ff8888",background:"rgba(200,16,46,0.08)",border:"1px solid rgba(200,16,46,0.2)",padding:"8px 12px",marginBottom:16}}>{`⚠ Cut penalty: ${formatSal(calcCutPenalty(cutPlayer))} (${cutPlayer.years} yrs × ${formatSal(cutPlayer.salary)} × 0.5)`}</div>}
          <div style={{display:"flex",gap:10,marginTop:14}}><RedBtn onClick={doCut}>Cut Player</RedBtn><GhostBtn onClick={()=>setCutPlayer(null)}>Cancel</GhostBtn></div>
        </div>
      </Modal>

      {/* SAVE CONFIRM */}
      <Modal open={saveOpen} onClose={()=>setSaveOpen(false)} topColor="#4a8fd9">
        <CloseBtn onClose={()=>setSaveOpen(false)}/>
        <div style={{textAlign:"center",padding:"6px 0"}}>
          <div style={{fontSize:28,marginBottom:10}}>💾</div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:900,letterSpacing:2,textTransform:"uppercase",color:"#6ea4e8",marginBottom:8}}>Save Roster?</div>
          <p style={{color:C.muted,fontSize:13,lineHeight:1.7,marginBottom:10}}>Are you sure? This becomes the new saved state — Reset will revert to this point.</p>
          {cutPlayers.length>0&&<div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:"#90c8ff",background:"rgba(74,144,217,0.08)",border:"1px solid rgba(74,144,217,0.2)",padding:"8px 12px",marginBottom:14}}>{cutPlayers.length} cut player(s) with {formatSal(capPenalty)} in dead cap will be saved</div>}
          <div style={{display:"flex",gap:10,marginTop:14}}><RedBtn onClick={doSave} style={{background:"#2a6e2e"}}>Yes, Save</RedBtn><GhostBtn onClick={()=>setSaveOpen(false)}>Cancel</GhostBtn></div>
        </div>
      </Modal>

      {/* RESET CONFIRM */}
      <Modal open={resetOpen} onClose={()=>setResetOpen(false)} topColor="#b07000">
        <CloseBtn onClose={()=>setResetOpen(false)}/>
        <div style={{textAlign:"center",padding:"6px 0"}}>
          <div style={{fontSize:28,marginBottom:10}}>↩</div>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:900,letterSpacing:2,textTransform:"uppercase",color:"#ffb347",marginBottom:8}}>Reset Roster?</div>
          <p style={{color:C.muted,fontSize:13,lineHeight:1.7,marginBottom:10}}>Discard all unsaved changes and revert to your last saved roster?<br/><strong style={{color:C.white}}>All edits, additions, and removals will be undone.</strong></p>
          <div style={{display:"flex",gap:10,marginTop:14}}><RedBtn onClick={doReset} style={{background:"#8a5500"}}>Yes, Reset</RedBtn><GhostBtn onClick={()=>setResetOpen(false)}>Cancel</GhostBtn></div>
        </div>
      </Modal>

      {/* TOAST */}
      {toast&&<div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:C.surface2,border:`1px solid ${C.border}`,borderLeft:`4px solid ${toast.color}`,color:C.offwhite,padding:"10px 20px",fontFamily:"'Share Tech Mono',monospace",fontSize:12,letterSpacing:0.5,boxShadow:"0 8px 30px rgba(0,0,0,0.5)",zIndex:9999,whiteSpace:"nowrap",animation:"fadeUp 0.3s ease both"}}>{toast.msg}</div>}
    </>
  );
}


// ── WATCH FORM ────────────────────────────────────────────────
function WatchForm({ initial, existingNames, onSave, onCancel, pool=[], poolLoading=false, poolError=null }) {
  const [f, setF] = useState({ name: initial?.name||"", pos: initial?.pos||"QB", team: initial?.team||"", age: initial?.age||"", salary: initial?.salary||"", years: initial?.years||"" });
  const [autofilled, setAutofilled] = useState(false);
  const set = (k,v) => setF(p=>({...p,[k]:v}));

  function handlePoolSelect(p) {
    setF(prev=>({...prev, name:p.name, pos:p.pos, team:p.team||prev.team, age:p.age||prev.age}));
    setAutofilled(true);
  }

  function handleSubmit() {
    if (!f.name.trim()) return;
    onSave({ name: f.name.trim(), pos: f.pos, team: f.team.trim(), age: parseInt(f.age)||0, salary: parseFloat(f.salary)||0, years: parseInt(f.years)||0 });
  }

  const inputSt = {background:C.bg,border:`1px solid ${C.border}`,color:C.white,padding:"9px 12px",width:"100%",fontFamily:"'Share Tech Mono',monospace",fontSize:13,outline:"none"};
  const POS_OPTS = ["QB","TmQB","RB","WR","TE"];

  return (
    <div>
      <div style={{marginBottom:14}}>
        <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:C.muted,marginBottom:7}}>Player Name</div>
        <div style={{position:"relative"}}>
          <PlayerSearchField value={f.name} onChange={v=>{set("name",v);setAutofilled(false);}} onSelect={handlePoolSelect} existingNames={existingNames} pool={pool} poolLoading={poolLoading} poolError={poolError}/>
        </div>
        {autofilled&&<div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:"#77dd77",marginTop:5,padding:"6px 10px",background:"rgba(119,221,119,0.08)",border:"1px solid rgba(119,221,119,0.2)"}}>✓ Player matched from rankings</div>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div>
          <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:C.muted,marginBottom:7}}>Position</div>
          <select style={{...inputSt,cursor:"pointer"}} value={f.pos} onChange={e=>set("pos",e.target.value)}>
            {POS_OPTS.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
        </div>
        <div>
          <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:C.muted,marginBottom:7}}>Team</div>
          <input style={inputSt} value={f.team} onChange={e=>set("team",e.target.value.toUpperCase())} placeholder="e.g. KC" maxLength={4}/>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        <div>
          <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:C.muted,marginBottom:7}}>Age</div>
          <input style={inputSt} type="number" value={f.age} onChange={e=>set("age",e.target.value)} placeholder="—" min="18" max="45"/>
        </div>
        <div>
          <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:C.muted,marginBottom:7}}>Target Salary ($)</div>
          <input style={inputSt} type="number" value={f.salary} onChange={e=>set("salary",e.target.value)} placeholder="e.g. 25000" min="0"/>
        </div>
        <div>
          <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:C.muted,marginBottom:7}}>Contract Yrs</div>
          <input style={inputSt} type="number" value={f.years} onChange={e=>set("years",e.target.value)} placeholder="e.g. 3" min="0" max="10"/>
        </div>
      </div>
      <div style={{display:"flex",gap:10}}>
        <button onClick={handleSubmit} disabled={!f.name.trim()} style={{flex:1,background:f.name.trim()?C.red:"#1e2d5a",border:"none",color:f.name.trim()?"#fff":C.muted,padding:12,fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:800,letterSpacing:3,textTransform:"uppercase",cursor:f.name.trim()?"pointer":"default"}}>
          Save
        </button>
        <button onClick={onCancel} style={{background:"transparent",border:`1px solid ${C.border}`,color:C.muted,padding:12,fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:700,letterSpacing:2,textTransform:"uppercase",cursor:"pointer",minWidth:80}}>
          Cancel
        </button>
      </div>
    </div>
  );
}

// ── FUTURE SEASONS PAGE ──────────────────────────────────────
function FutureSeasons({ players, teamName, onBack }) {
  const [hideHypo, setHideHypo] = useState(false);
  // cutMap: { [playerId]: offset } — the season offset at which this player was cut
  const [cutMap, setCutMap] = useState({});

  const C2 = {
    bg:"#05091a", surface:"#0b1230", surface2:"#0f1940",
    border:"#1e2d5a", red:"#C8102E", red2:"#a00d24",
    blue2:"#001a44", white:"#F5F5F5", offwhite:"#c8d0e4",
    muted:"#6b7eaa",
  };
  const posColor = { QB:"#ff7a7a", TmQB:"#ffb347", RB:"#56ccf2", WR:"#c3b1e1", TE:"#77dd77" };

  function PosChipS({ pos }) {
    const c = posColor[pos]||C2.muted;
    return <span style={{display:"inline-block",padding:"1px 5px",borderRadius:2,fontFamily:"'Barlow Condensed',sans-serif",fontSize:11,fontWeight:700,letterSpacing:0.5,background:"rgba(255,255,255,0.06)",border:`1px solid ${c}`,color:c,whiteSpace:"nowrap"}}>{pos}</span>;
  }

  const fmtS = v => {
    if (!v && v !== 0) return "$0";
    const n = Number(v);
    if (Math.abs(n) >= 1000) return "$" + parseFloat((Math.abs(n)/1000).toFixed(1)) + "K";
    return "$" + Math.abs(n);
  };

  // Penalty for cutting a player = (salary * years * 0.5) - salary
  // but on this page "years" means years remaining at the time of cut
  // = same formula as main page net cap hit
  const cutPenalty = (p, offset) => {
    const yrsLeft = (p.years||0) - offset;
    return Math.round((p.salary||0) * yrsLeft * 0.5); // always ≥ 0
  };

  // Base pool: active, non-taxi, non-removed players
  const basePlayers = players.filter(p => !p.watch);

  // For a given season offset:
  // - Player is ON ROSTER if years > offset AND not cut in this season or earlier
  // - Player is CUT in this season if cutMap[id] === offset
  // - Player is CUT EARLIER (disabled/faded) if cutMap[id] < offset
  function getSeasonState(offset) {
    return basePlayers
      .filter(p => (p.years||0) > offset)           // contract covers this season
      .filter(p => hideHypo ? !p.temp : true)        // hypo toggle
      .map(p => ({
        ...p,
        cutThisSeason:    cutMap[p.id] === offset,
        cutEarlier:       cutMap[p.id] !== undefined && cutMap[p.id] < offset,
        canCut:           cutMap[p.id] === undefined, // not already cut somewhere
      }));
  }

  function getSeasonMetrics(offset) {
    const all = getSeasonState(offset);
    // Salary cap = only active (not cut) players
    const capUsed = all
      .filter(p => !p.cutThisSeason && !p.cutEarlier)
      .reduce((s,p) => s + (p.ir ? (p.salary||0)*0.5 : (p.salary||0)), 0);
    // Cap penalty = only players CUT in THIS season
    const penaltyTotal = all
      .filter(p => p.cutThisSeason)
      .reduce((s,p) => s + cutPenalty(p, offset), 0); // always >= 0
    return { capUsed, penaltyTotal, all };
  }

  function doCut(playerId, offset) {
    setCutMap(prev => ({ ...prev, [playerId]: offset }));
  }
  function undoCut(playerId) {
    setCutMap(prev => { const n={...prev}; delete n[playerId]; return n; });
  }

  const seasons = [
    { label:"Year 2", offset:1 },
    { label:"Year 3", offset:2 },
    { label:"Year 4", offset:3 },
  ];

  const capPctS = (used, penalty) => Math.min(110, Math.round(((used+penalty)/TOTAL_CAP)*100));

  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap');
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{margin:0;background:#05091a;color:#c8d4ee;font-family:'Barlow',sans-serif;}
        input,select,button{font-family:inherit;}
        ::-webkit-scrollbar{width:3px;} ::-webkit-scrollbar-thumb{background:#1e2d5a;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      `}</style>

      {/* HEADER */}
      <div style={{background:C2.blue2,borderBottom:`3px solid ${C2.red}`,padding:"0 14px",height:52,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,boxShadow:"0 4px 20px rgba(0,0,0,0.5)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={onBack} style={{background:"transparent",border:"1px solid #1e2d5a",color:"#6b7eaa",padding:"5px 10px",fontFamily:"'Barlow Condensed',sans-serif",fontSize:13,fontWeight:700,letterSpacing:2,textTransform:"uppercase",cursor:"pointer"}}>← Back</button>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:900,letterSpacing:2,color:C2.white,textShadow:"0 1px 6px rgba(0,0,0,0.5)"}}>
            Future <span style={{color:C2.red}}>Seasons</span>
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {Object.keys(cutMap).length > 0 && (
            <button onClick={()=>setCutMap({})} style={{padding:"4px 10px",border:"1px solid rgba(200,16,46,0.4)",background:"rgba(200,16,46,0.08)",color:"#ff8888",fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:1,cursor:"pointer",textTransform:"uppercase"}}>
              Reset Cuts
            </button>
          )}
          <label style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer",userSelect:"none"}}>
            <input type="checkbox" checked={!hideHypo} onChange={e=>setHideHypo(!e.target.checked)}
              style={{accentColor:"#a78bfa",width:14,height:14,cursor:"pointer"}}/>
            <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:1,textTransform:"uppercase",color:hideHypo?"#6b7eaa":"#a78bfa"}}>Show Hypotheticals</span>
          </label>
        </div>
      </div>

      <div style={{maxWidth:640,margin:"0 auto",padding:"14px 12px 60px"}}>
        <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:10,color:"#6b7eaa",marginBottom:14,lineHeight:1.6,padding:"8px 12px",background:"rgba(30,45,90,0.3)",border:"1px solid #1e2d5a"}}>
          Cuts made here are <strong style={{color:"#c8d0e4"}}>simulations only</strong> — they don't affect your saved roster. Cap penalties only apply in the season a player is cut.
          {!hideHypo&&basePlayers.filter(p=>p.temp).length>0&&<span style={{color:"#a78bfa",marginLeft:6}}>· Hypotheticals included</span>}
        </div>

        {seasons.map(({label, offset})=>{
          const { capUsed, penaltyTotal, all } = getSeasonMetrics(offset);
          const totalCapImpact = capUsed + penaltyTotal; // Cap Space = TOTAL_CAP - salaries - penalties
          const capSpace = TOTAL_CAP - totalCapImpact;
          const pct = Math.min(100, Math.round((totalCapImpact/TOTAL_CAP)*100));
          const isOverCap = totalCapImpact > TOTAL_CAP;

          const sorted = [...all].sort((a,b) => {
            // cut players go to bottom
            const aOut = a.cutThisSeason||a.cutEarlier ? 1 : 0;
            const bOut = b.cutThisSeason||b.cutEarlier ? 1 : 0;
            if (aOut !== bOut) return aOut - bOut;
            const d = (POS_ORDER[a.pos]||0)-(POS_ORDER[b.pos]||0);
            return d!==0 ? d : a.name.localeCompare(b.name);
          });

          return (
            <div key={label} style={{marginBottom:32,animation:"fadeUp 0.3s ease both"}}>

              {/* Season header */}
              <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:8}}>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:900,letterSpacing:2,textTransform:"uppercase",color:C2.white}}>
                  {label} <span style={{color:C2.red,fontSize:14,fontWeight:700}}>/ {new Date().getFullYear()+offset}</span>
                </div>
              </div>

              {/* Cap bar */}
              <div style={{height:7,background:"#05091a",border:"1px solid #1e2d5a",overflow:"hidden",marginBottom:10,position:"relative"}}>
                {/* salary portion */}
                <div style={{position:"absolute",top:0,left:0,height:"100%",width:`${Math.min(100,Math.round((capUsed/TOTAL_CAP)*100))}%`,background:pct>100?"linear-gradient(90deg,#a00d24,#C8102E)":pct>90?"linear-gradient(90deg,#c06000,#ffb347)":"linear-gradient(90deg,#002868,#4a8fd9)",transition:"width 0.4s ease"}}/>
                {/* penalty portion on top of salary */}
                {penaltyTotal>0&&<div style={{position:"absolute",top:0,left:`${Math.min(100,Math.round((capUsed/TOTAL_CAP)*100))}%`,height:"100%",width:`${Math.min(100-Math.round((capUsed/TOTAL_CAP)*100), Math.round((penaltyTotal/TOTAL_CAP)*100))}%`,background:"rgba(255,100,100,0.7)",transition:"width 0.4s ease"}}/>}
              </div>

              {/* Player table */}
              <div style={{background:C2.surface,border:"1px solid #1e2d5a",overflowX:"auto"}}>
                {sorted.length===0 ? (
                  <div style={{padding:"20px",textAlign:"center",fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:C2.muted}}>No players under contract in {label}</div>
                ) : (
                  <table style={{width:"100%",borderCollapse:"collapse",tableLayout:"fixed",minWidth:300}}>
                    <colgroup>
                      <col style={{width:"auto"}}/><col style={{width:56}}/><col style={{width:44}}/><col style={{width:28}}/><col style={{width:50}}/>
                    </colgroup>
                    <thead>
                      <tr style={{background:C2.surface2,borderBottom:"2px solid #1e2d5a"}}>
                        <th style={{padding:"6px 8px",textAlign:"left",fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:1.5,textTransform:"uppercase",color:C2.muted}}>Player</th>
                        <th style={{padding:"6px 6px",textAlign:"right",fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:1.5,textTransform:"uppercase",color:C2.muted}}>Salary</th>
                        <th style={{padding:"6px 6px",textAlign:"right",fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:1.5,textTransform:"uppercase",color:C2.muted}}>Yrs</th>
                        <th style={{padding:"6px 4px",textAlign:"center",fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:C2.muted}}>★</th>
                        <th style={{padding:"6px 8px",textAlign:"right",fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:C2.muted}}></th>
                      </tr>
                    </thead>
                    <tbody>
                      {sorted.map((p,i)=>{
                        const yrsLeft = (p.years||0)-offset;
                        const isCutHere    = p.cutThisSeason;
                        const isCutBefore  = p.cutEarlier;
                        const isDisabled   = isCutHere || isCutBefore;
                        const pen = cutPenalty(p, offset);
                        const dispSal = p.taxi ? "—" : fmtS(p.ir?(p.salary||0)*0.5:p.salary||0);

                        return (
                          <tr key={p.id} style={{
                            borderBottom:`1px solid ${i===sorted.length-1?"transparent":"#1e2d5a"}`,
                            borderLeft:`3px solid ${isDisabled?C2.border:posColor[p.pos]||C2.muted}`,
                            opacity: isCutBefore ? 0.3 : isCutHere ? 0.5 : 1,
                            background: isCutHere?"rgba(200,16,46,0.06)":p.temp?"rgba(167,139,250,0.04)":p.starter?"rgba(255,215,0,0.02)":"transparent",
                          }}>
                            {/* Name */}
                            <td style={{padding:"7px 8px",verticalAlign:"middle",overflow:"hidden"}}>
                              <div style={{display:"flex",alignItems:"center",gap:5}}>
                                <PosChipS pos={p.pos}/>
                                <div style={{minWidth:0,flex:1}}>
                                  <div style={{display:"flex",alignItems:"center",gap:4}}>
                                    <span style={{fontFamily:"'Barlow',sans-serif",fontWeight:600,fontSize:12,color:isCutHere||isCutBefore?C2.muted:p.temp?"#fde68a":C2.white,textDecoration:isCutHere||isCutBefore?"line-through":"none",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</span>
                                    {p.temp&&!isDisabled&&<span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:8,color:"#a78bfa",border:"1px solid #a78bfa",padding:"1px 3px",flexShrink:0}}>HYP</span>}
                                    {p.ir&&!isDisabled&&<span style={{fontSize:11,flexShrink:0}}>🏥</span>}
                                    {isCutHere&&<span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:8,color:"#ff8888",border:"1px solid rgba(200,16,46,0.4)",padding:"1px 3px",flexShrink:0}}>CUT</span>}
                                    {isCutBefore&&<span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:8,color:C2.muted,border:`1px solid ${C2.border}`,padding:"1px 3px",flexShrink:0}}>GONE</span>}
                                  </div>
                                  <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:C2.muted,lineHeight:1.3}}>
                                    {p.team||"—"}
                                    {isCutHere&&pen>0&&<span style={{color:"#ff8888",marginLeft:5}}>pen: {fmtS(pen)}</span>}
                                  </div>
                                </div>
                              </div>
                            </td>
                            {/* Salary */}
                            <td style={{padding:"7px 6px",textAlign:"right",verticalAlign:"middle",whiteSpace:"nowrap"}}>
                              <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:12,color:isDisabled?C2.muted:C2.offwhite,fontWeight:500}}>{isDisabled?"—":dispSal}</div>
                              {p.ir&&!isDisabled&&<div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:"#ff8888"}}>½ cap</div>}
                            </td>
                            {/* Yrs left */}
                            <td style={{padding:"7px 6px",textAlign:"right",verticalAlign:"middle",whiteSpace:"nowrap"}}>
                              <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:isDisabled?C2.border:yrsLeft<=1?"#ff8888":C2.muted}}>{isDisabled?"—":`${yrsLeft}yr`}</span>
                            </td>
                            {/* Starter star */}
                            <td style={{padding:"7px 4px",textAlign:"center",verticalAlign:"middle"}}>
                              <span style={{fontSize:13,color:p.starter&&!isDisabled?"#ffd700":C2.border}}>{p.starter&&!isDisabled?"★":"☆"}</span>
                            </td>
                            {/* Cut action */}
                            <td style={{padding:"7px 8px",textAlign:"right",verticalAlign:"middle",whiteSpace:"nowrap"}}>
                              {isCutBefore ? (
                                <span style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:C2.border}}>—</span>
                              ) : isCutHere ? (
                                <button onClick={()=>undoCut(p.id)} style={{background:"rgba(200,16,46,0.1)",border:"1px solid rgba(200,16,46,0.35)",color:"#ff8888",padding:"3px 7px",fontFamily:"'Share Tech Mono',monospace",fontSize:9,cursor:"pointer",textTransform:"uppercase"}}>Undo</button>
                              ) : (
                                <button onClick={()=>doCut(p.id, offset)} style={{background:"transparent",border:"1px solid #1e2d5a",color:C2.muted,padding:"3px 7px",fontFamily:"'Share Tech Mono',monospace",fontSize:9,cursor:"pointer",textTransform:"uppercase"}}
                                  onMouseEnter={e=>{e.currentTarget.style.borderColor="#C8102E";e.currentTarget.style.color="#ff8888";}}
                                  onMouseLeave={e=>{e.currentTarget.style.borderColor="#1e2d5a";e.currentTarget.style.color=C2.muted;}}
                                >Cut</button>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                )}
              </div>

              {/* PROMINENT CAP FOOTER */}
              <div style={{background:"#080d1e",border:"1px solid #1e2d5a",borderTop:"2px solid #1e2d5a",padding:"14px 16px",marginTop:0}}>
                {/* Cap row */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:penaltyTotal>0?12:0}}>
                  <div>
                    <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C2.muted,marginBottom:3}}>Total Cap</div>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:800,lineHeight:1,color:C2.white}}>{fmtS(TOTAL_CAP)}</div>
                  </div>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C2.muted,marginBottom:3}}>Cap Used</div>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:800,lineHeight:1,color:C2.offwhite}}>{fmtS(capUsed)}</div>
                    {penaltyTotal>0&&<div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:"#6b7eaa",marginTop:2}}>+{fmtS(penaltyTotal)} penalty</div>}
                  </div>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C2.muted,marginBottom:3}}>Cap Penalty</div>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:800,lineHeight:1,color:penaltyTotal>0?"#ff8888":C2.muted}}>
                      {fmtS(penaltyTotal)}
                    </div>
                    <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:C2.muted,marginTop:2}}>{penaltyTotal>0?"dead cap":"no cuts"}</div>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C2.muted,marginBottom:3}}>{isOverCap?"Over Cap":"Cap Space"}</div>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:800,lineHeight:1,color:isOverCap?C2.red:"#77dd77"}}>{fmtS(Math.abs(capSpace))}</div>
                    <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,color:C2.muted,marginTop:2}}>{pct}% used</div>
                  </div>
                </div>
                {/* Penalty breakdown if any cuts */}
                {penaltyTotal>0&&(
                  <div style={{borderTop:"1px solid #1e2d5a",paddingTop:10}}>
                    <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C2.muted,marginBottom:6}}>Cut Penalties This Season</div>
                    {all.filter(p=>p.cutThisSeason).map(p=>{
                      const pen = cutPenalty(p, offset);
                      return (
                        <div key={p.id} style={{display:"flex",justifyContent:"space-between",fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:"#ff8888",marginBottom:3}}>
                          <span>{p.name}</span>
                          <span>{fmtS(pen)}</span>
                        </div>
                      );
                    })}
                    <div style={{display:"flex",justifyContent:"space-between",fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:"#ff8888",marginTop:6,paddingTop:6,borderTop:"1px solid rgba(200,16,46,0.2)",fontWeight:700}}>
                      <span>Total Penalty</span>
                      <span>{fmtS(penaltyTotal)}</span>
                    </div>
                  </div>
                )}
              </div>

            </div>
          );
        })}
      </div>
    </>
  );
}




ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  
  </script>
</body>
