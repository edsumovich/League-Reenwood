// Try multiple CORS proxies in order until one works
const CORS_PROXIES = [
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  url => url, // direct last-resort (will fail if MFL blocks CORS, but worth trying)
];

async function mflFetch(type, extra="") {
  const target = `https://api.myfantasyleague.com/${MFL_SEASON}/export?TYPE=${type}&L=${MFL_LEAGUE_ID}&JSON=1${extra}`;
  let lastErr = null;
  for (const proxy of CORS_PROXIES) {
    try {
      const proxied = proxy(target);
      const res = await fetch(proxied, { cache: "no-cache" });
      if (!res.ok) { lastErr = new Error(`HTTP ${res.status} from ${proxied}`); continue; }
      const text = await res.text();
      // Basic sanity: MFL JSON always starts with {
      if (!text.trim().startsWith("{")) { lastErr = new Error("Non-JSON response"); continue; }
      return JSON.parse(text);
    } catch(e) { lastErr = e; }
  }
  throw lastErr || new Error("All proxies failed");
}

// CSV column header → index mapping (0-based)
// Expected headers: RK, TIERS, PLAYER NAME, TEAM, POS, AGE, BEST, WORST, AVG., STD.DEV, ECR VS. ADP
// We extract: PLAYER NAME, TEAM, POS (strip trailing digit), AGE
// Positions mapped: QB→QB, RB→RB, WR→WR, TE→TE, DST/K → skipped (not fantasy-relevant here)

function parsePlayerCSV(csvText) {
  const lines = csvText.trim().split(/\r?\n/);
  if (lines.length < 2) return [];

  // Parse header row to find column indices dynamically
  const headers = parseCSVRow(lines[0]).map(h => h.trim().toUpperCase());
  const iName = headers.findIndex(h => h.includes("PLAYER") && h.includes("NAME"));
  const iTeam = headers.findIndex(h => h === "TEAM");
  const iPos  = headers.findIndex(h => h === "POS");
  const iAge  = headers.findIndex(h => h === "AGE");

  if (iName < 0 || iTeam < 0 || iPos < 0) return [];

  const players = [];
  const seen = new Set();

  for (let i = 1; i < lines.length; i++) {
    const cols = parseCSVRow(lines[i]);
    if (!cols || cols.length < Math.max(iName, iTeam, iPos) + 1) continue;

    const name = cols[iName]?.trim();
    const team = cols[iTeam]?.trim().toUpperCase();
    // Strip trailing digits from position: WR1→WR, RB2→RB, QB1→QB, TE1→TE
    const rawPos = cols[iPos]?.trim().toUpperCase().replace(/\d+$/, "");
    const age  = iAge >= 0 ? parseInt(cols[iAge]) || 0 : 0;

    if (!name || !rawPos) continue;
    // Only include positions the app tracks
    if (!["QB","RB","WR","TE"].includes(rawPos)) continue;
    // Skip duplicates by name
    if (seen.has(name)) continue;
    seen.add(name);

    players.push({ name, team: team||"", pos: rawPos, age });
  }
  return players;
}

// Handles quoted fields with commas inside them
function parseCSVRow(line) {
  const result = [];
  let cur = "";
  let inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      inQuote = !inQuote;
    } else if (ch === "," && !inQuote) {
      result.push(cur);
      cur = "";
    } else if (ch === "\t" && !inQuote) {
      // Also handle tab-separated
      result.push(cur);
      cur = "";
    } else {
      cur += ch;
    }
  }
  result.push(cur);
  return result;
}


// ── MFL DATA HOOK ─────────────────────────────────────────────
// Fetches franchises + rosters + player details from MFL API
// Maps MFL positions to app positions: QB→QB, RB→RB, WR→WR, TE→TE, TMQB→TmQB
function mapMFLPos(mflPos) {
  if (!mflPos) return null;
  const p = mflPos.toUpperCase();
  if (p === "QB")   return "QB";
  if (p === "RB")   return "RB";
  if (p === "WR")   return "WR";
  if (p === "TE")   return "TE";
  if (p === "TMQB") return "TmQB";
  return null; // skip K, DEF, DL, LB, DB, etc.
}

function useMFLData() {
  const [franchises, setFranchises]   = useState([]); // [{id, name}]
  const [mflRosters, setMflRosters]   = useState({}); // {franchiseId: [{mflId, salary, contractYear}]}
  const [mflPlayers, setMflPlayers]   = useState({}); // {mflId: {name, pos, team}}
  const [loading, setLoading]         = useState(true);
  const [error, setError]             = useState(null);

  useEffect(() => {
    async function load() {
      try {
        // Step 1: fetch franchises
        const fData = await mflFetch("franchises");
        const rawFranchises = fData?.franchises?.franchise || [];
        const franArr = Array.isArray(rawFranchises) ? rawFranchises : [rawFranchises];
        const fList = franArr.map(f => ({ id: f.id, name: f.name }))
          .sort((a,b) => a.name.localeCompare(b.name));
        setFranchises(fList);

        // Step 2: fetch all rosters
        const rData = await mflFetch("rosters");
        const rawFranRosters = rData?.rosters?.franchise || [];
        const franRosters = Array.isArray(rawFranRosters) ? rawFranRosters : [rawFranRosters];
        
        // Build roster map: franchiseId → array of {id, salary, contractYear, status}
        const rosterMap = {};
        for (const fr of franRosters) {
          const rawPlayers = fr.player || [];
          const playerArr  = Array.isArray(rawPlayers) ? rawPlayers : [rawPlayers];
          rosterMap[fr.id] = playerArr.map(p => ({
            mflId:        p.id,
            salary:       parseInt(p.salary)||0,
            contractYear: parseInt(p.contractYear)||0,
            status:       p.status||"",
          }));
        }
        setMflRosters(rosterMap);

        // Collect all unique player IDs across all rosters
        const allIds = [...new Set(
          Object.values(rosterMap).flat().map(p => p.mflId).filter(Boolean)
        )];

        if (allIds.length === 0) {
          setLoading(false);
          return;
        }

        // Step 3: fetch player details in batches (MFL supports comma-separated IDs)
        const BATCH = 200;
        const playerMap = {};
        for (let i = 0; i < allIds.length; i += BATCH) {
          const batch = allIds.slice(i, i+BATCH).join(",");
          const pData = await mflFetch("players", `&PLAYERS=${batch}&DETAILS=1`);
          const rawP  = pData?.players?.player || [];
          const pArr  = Array.isArray(rawP) ? rawP : [rawP];
          for (const p of pArr) {
            playerMap[p.id] = {
              name: p.name,           // MFL format is "Last, First"
              pos:  p.position,
              team: p.team,
            };
          }
        }
        setMflPlayers(playerMap);
        setLoading(false);
      } catch(e) {
        console.error("MFL fetch error:", e);
        setError(e.message || "Could not load MFL data");
        setLoading(false);
      }
    }
    load();
  }, []);

  // Helper: build a roster array for a given franchise ID, merged with player details
  function buildRoster(franchiseId) {
    const rosterEntries = mflRosters[franchiseId] || [];
    const appPlayers = [];
    for (const entry of rosterEntries) {
      const pd = mflPlayers[entry.mflId];
      if (!pd) continue;
      const appPos = mapMFLPos(pd.pos);
      if (!appPos) continue; // skip non-fantasy positions

      // MFL name format: "Last, First" — convert to "First Last"
      const nameParts = pd.name.split(",").map(s=>s.trim());
      const name = nameParts.length === 2
        ? `${nameParts[1]} ${nameParts[0]}`
        : pd.name;

      const isTaxi = entry.status === "TAXI_SQUAD";
      const isIR   = entry.status === "IR";

      appPlayers.push({
        id:      `mfl_${entry.mflId}`,
        name,
        pos:     appPos,
        team:    pd.team || "",
        salary:  entry.salary,
        years:   entry.contractYear,
        rookie:  false,
        taxi:    isTaxi,
        ir:      isIR,
        starter: false,
        removed: false,
        temp:    false,
      });
    }
    return appPlayers;
  }

  return { franchises, mflRosters, mflPlayers, buildRoster, loading, error };
}

// Hook: fetches and parses the player pool CSV from Google Drive
function usePlayerPool() {
  const [pool, setPool]       = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState(null);

  useEffect(() => {
    // Try multiple proxies for Google Drive CSV
    const _driveBase = `https://drive.google.com/uc?export=download&id=${PLAYER_POOL_FILE_ID}`;
    const urls = [
      `https://corsproxy.io/?url=${encodeURIComponent(_driveBase)}`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(_driveBase)}`,
      `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(_driveBase)}`,
      `https://drive.usercontent.google.com/download?id=${PLAYER_POOL_FILE_ID}&export=download&authuser=0`,
    ];

    async function fetchPool() {
      let lastErr = null;
      for (const url of urls) {
        try {
          const res = await fetch(url, { cache: "no-cache" });
          if (!res.ok) { lastErr = new Error(`HTTP ${res.status}`); continue; }
          const text = await res.text();
          // Sanity check — should look like CSV with PLAYER NAME header
          if (!text.toUpperCase().includes("PLAYER")) {
            lastErr = new Error("Unexpected response — not a CSV");
            continue;
          }
          const parsed = parsePlayerCSV(text);
          if (parsed.length > 0) {
            setPool(parsed);
            setLoading(false);
            return;
          }
        } catch (e) {
          lastErr = e;
        }
      }
      // If all URLs failed, show error but don't crash the app
      setError(lastErr?.message || "Could not load player list");
      setLoading(false);
    }

    fetchPool();
  }, []);

  return { pool, loading, error };
}

// Net Cap Hit column = (salary × years × 0.5) - salary  [can be negative]
const calcNetCapHit = p => Math.round((p.salary||0)*(p.years||0)*0.5 - (p.salary||0));

// Cut Penalty = salary × years_remaining × 0.5  [always ≥ 0, no salary offset]
const calcCutPenalty = p => Math.round((p.salary||0)*(p.years||0)*0.5);

// Format: >=1000 → $x.xK  |  <1000 → $n
const formatSal = v => {
  if (v == null || v === "" || v === 0) return "$0";
  const n = Number(v);
  if (n >= 1000) return "$" + parseFloat((n/1000).toFixed(1)) + "K";
  return "$" + n;
};
