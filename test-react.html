<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root" style="color:white;background:#05091a;padding:20px;min-height:100vh;font-family:monospace"></div>
  <script>
    // Error capture before Babel runs
    window.onerror = function(msg,src,line,col,err) {
      document.getElementById("root").innerHTML += "<div style='color:#ff8888'>GLOBAL ERROR: "+msg+" at "+line+":"+col+"</div>";
    };
    window.onunhandledrejection = function(e) {
      document.getElementById("root").innerHTML += "<div style='color:#ff8888'>PROMISE ERROR: "+(e.reason||e)+"</div>";
    };
  </script>
  <script type="text/babel" data-presets="react">
    const { useState } = React;
    function App() {
      const [count, setCount] = useState(0);
      return (
        <div>
          <div style={{color:"#77dd77",fontSize:20,marginBottom:10}}>✓ React + Babel working</div>
          <div style={{color:"#c8d4ee"}}>Count: {count}</div>
          <button onClick={()=>setCount(c=>c+1)} style={{marginTop:10,padding:"8px 16px",background:"#C8102E",color:"white",border:"none",cursor:"pointer"}}>
            Increment
          </button>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
